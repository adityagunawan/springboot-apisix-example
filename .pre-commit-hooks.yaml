- id: check-commit-message
  name: check commit message
  entry: check-commit-message
  language: golang
  description: >
    Check commit message
    Arguments:
      - "--author" to allow authors
      - "--trello" to allow Trello ID
  fail_fast: true
  stages: [commit-msg]
- id: go-lint
  name: Go lint
  entry: go-lint
  language: golang
  description: >
    Lint with golangci-lint
    Requires:
      - https://golangci-lint.run/
    Sample .golangci.yml
      run:
        timeout: 5m
        issues-exit-code: 2
      linters:
        enable:
          - gocritic
          - gocyclo
          - gofmt
          - goimports
          - gomodguard
          - gosec
          - gosimple
          - govet
          - ineffassign
          - staticcheck
          - typecheck
          - unused
        disable:
          - errcheck
  fail_fast: true
  stages: [pre-commit]
- id: nodejs-lint
  name: NodeJS lint
  entry: nodejs-lint
  language: golang
  description: >
    Lint with typescript-eslint
    Requires:
      - https://typescript-eslint.io/getting-started/
    Sample .eslintrc.js
      module.exports = {
        parser: '@typescript-eslint/parser',
        plugins: ['@typescript-eslint'],
        extends: [
          'eslint:recommended',
          'plugin:@typescript-eslint/recommended',
        ],
        rules: {
          '@typescript-eslint/no-unused-vars': 'error',
          // Add more rules as needed
        },
      };
  fail_fast: true
  stages: [pre-commit]
