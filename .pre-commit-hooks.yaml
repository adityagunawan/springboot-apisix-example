- id: migrate-up
  name: migrate up
  entry: migrate-up
  language: golang
  description: >
    Migrate upwards for integration and performance tests with GoLang Migrate CLI and local MySQL
    Requires:
      - https://github.com/golang-migrate/migrate
      - Migration files on tools/mysql/
    Environment variables:
      - DATABASE_TEST, eg; root:root@/test
      - MIGRATE_PATH, eg; tools/mysql
  fail_fast: true
  stages: [pre-commit]
